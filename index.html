<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>EyeRest</title>

  style.css
</head>

<body>
  <main class="app-container">
    <header class="app-header">
      <h1>EyeRest</h1>
      <p>디지털 눈 피로 예방을 위한 휴식 관리 시스템</p>
    </header>

    <section class="card">
      <h2>오늘의 눈 상태 확인</h2>

      <p class="description">
        현재 느끼는 불편 정도를 선택해 주세요.
      </p>

      <div class="question">
        <label for="fatigue">
          눈의 피로도
          <span id="fatigueValue">0</span>점
        </label>

        <input
          type="range"
          id="fatigue"
          min="0"
          max="5"
          value="0"
        >
      </div>

      <div class="question">
        <label for="dryness">
          건조감
          <span id="drynessValue">0</span>점
        </label>

        <input
          type="range"
          id="dryness"
          min="0"
          max="5"
          value="0"
        >
      </div>

      <div class="question">
        <label for="blur">
          흐릿하게 보이는 느낌
          <span id="blurValue">0</span>점
        </label>

        <input
          type="range"
          id="blur"
          min="0"
          max="5"
          value="0"
        >
      </div>

      <div class="question">
        <label for="discomfort">
          눈 주변 불편감
          <span id="discomfortValue">0</span>점
        </label>

        <input
          type="range"
          id="discomfort"
          min="0"
          max="5"
          value="0"
        >
      </div>

      <button id="checkButton">
        눈 상태 확인하기
      </button>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <h2>확인 결과</h2>

      <div id="statusBadge" class="status-badge">
        상태
      </div>

      <p>
        총 불편 점수:
        <strong id="totalScore">0</strong>점
      </p>

      <p id="resultMessage"></p>

      <p class="medical-notice">
        본 결과는 질환을 진단하거나 치료하기 위한 정보가
        아닙니다. 불편감이 지속되거나 심한 증상이 있는 경우
        의료 전문가와 상담하시기 바랍니다.
      </p>
    </section>
  </main>

  script.jsscript>
</body>
</html>
